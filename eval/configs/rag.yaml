name: rag
description: 런북 선택만 RAG로 교체. 검색 품질 변화를 단독으로 본다.
backend: openai
runbook_selection: rag
validator: rule
cost:
  model_tiering: false
  cache: false
models:
  fast: gpt-4o-mini
  quality: gpt-4o
rag:
  top_k: 3                      # 순위 길이 (Recall@3 대상)
  margin: 0.05                  # 1위 점수 - 0.05 이내만 write 에 투입. 측정 결과 보기 전 고정
  embedding: text-embedding-3-small
