name: rag_judge_cost
description: 위에 비용 최적화 추가 — 1차 초안 저가 모델(반려 시에만 gpt-4o 재작성) + 질의 캐시. 최종 After.
backend: openai
runbook_selection: rag
validator: judge
cost:
  model_tiering: true           # write 캐스케이드: 1차 gpt-4o-mini → Judge 반려 시 gpt-4o
  cache: true                   # 정규화 질의 키로 route, plan, 질의 임베딩 캐시 (모니터링, 답변은 캐시 안 함)
  cache_ttl: 600
models:
  fast: gpt-4o-mini
  quality: gpt-4o
  cascade_writer: gpt-4o-mini
  judge: gpt-4o-mini
rag:
  top_k: 3
  margin: 0.05
  embedding: text-embedding-3-small
judge:
  threshold: 0.75
  max_retries: 2
  max_seconds: 120
