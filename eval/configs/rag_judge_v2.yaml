name: rag_judge_v2
description: 1차 실측 약점 보완 — RAG 최소 유사도·미등록 안내 + Judge v2(근거 밖 요구 금지·fixable) + 수치 코드 검증.
backend: openai
runbook_selection: rag
validator: judge
cost:
  model_tiering: false
  cache: false
models:
  fast: gpt-4o-mini
  quality: gpt-4o
  judge: gpt-4o-mini
rag:
  top_k: 3
  margin: 0.05
  min_score: 0.3236          # dev 24건만으로 보정 (results/calibrate_rag.json): gold 없는 최고 0.3225 와 gold 있는 최저 0.3248 의 중간. holdout 미사용
  notices: true              # 등록 시스템명 없음 → 폴백 조회 사실을 근거에 명시
  embedding: text-embedding-3-small
judge:
  version: 2
  factcheck: true
  threshold: 0.75
  max_retries: 2
  max_seconds: 120
