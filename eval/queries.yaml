# 평가셋 — 한 번 라벨링하면 구성이 바뀌어도 수정하지 않는다.
# 수정이 필요하면 version을 올리고 전 구성을 다시 돌린다.
version: 3
# v2 -> v3 변경: holdout 36건(Q25~Q60)을 추가했다. 기존 24건(Q01~Q24)은 문항을 그대로 두고 split: dev 필드만 붙였다.
#   split 정의:
#     dev     = v2의 24건(Q01~Q24). 개선 v2의 기준값 조정에만 사용한다.
#     holdout = v3에서 추가한 36건(Q25~Q60). 개선 v2 구현 전에 고정했고 최종 보고에만 사용한다.
#               조정(튜닝)에 쓰지 않는다. 문항은 측정 결과를 보기 전에 작성했다.
# v1 -> v2 변경: v1은 rb_db_down 같은 임시(placeholder) 런북 id와 7건뿐이었다.
#   v2는 베이스 코드(src/data/runbooks/)의 실제 런북 id 6종으로 교체하고 24건으로 확장했다.
#   human_label을 매기기 전에 교체했으므로 무효가 된 라벨링 데이터는 없다.
created: 2026-10-21
updated: 2026-10-21
threshold: 0.75         # 4지표 중 3개 이상 Pass (v1의 0.8은 4/4만 통과시키는 오류)

# human_label: 본인이 직접 매긴 Pass/Fail. Judge 판정과의 일치율 계산에 쓴다.
#              베이스 구성 답변을 보고 매긴다. 비워두면 일치율 계산에서 제외.
# gold_runbooks: 정답 런북 id. Recall@k / MRR 계산에 쓴다.
#              실제 id: cpu-spike, db-down, disk-full, high-latency, memory-leak, network-timeout
# must_include: 정답 런북 본문에 실제로 있는 핵심 어구 (없으면 빈 리스트).
# design_note: normal 문항만. aligned = 증상과 일치하는 알람을 가진 시스템을 지목한 문항,
#              paraphrased = 운영자가 자기 말로 증상을 풀어 쓴 문항.
# category: normal | constrained | composite | unregistered | ambiguous
# split: dev | holdout (위 v3 변경 설명 참조)

queries:
