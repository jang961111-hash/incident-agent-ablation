# 평가셋 — 한 번 라벨링하면 구성이 바뀌어도 수정하지 않는다.
# 수정이 필요하면 version을 올리고 전 구성을 다시 돌린다.
version: 2
# v1 -> v2 변경: v1은 rb_db_down 같은 임시(placeholder) 런북 id와 7건뿐이었다.
#   v2는 베이스 코드(src/data/runbooks/)의 실제 런북 id 6종으로 교체하고 24건으로 확장했다.
#   human_label을 매기기 전에 교체했으므로 무효가 된 라벨링 데이터는 없다.
created: 2026-10-21
threshold: 0.75         # 4지표 중 3개 이상 Pass (v1의 0.8은 4/4만 통과시키는 오류)

# human_label: 본인이 직접 매긴 Pass/Fail. Judge 판정과의 일치율 계산에 쓴다.
#              베이스 구성 답변을 보고 매긴다. 비워두면 일치율 계산에서 제외.
# gold_runbooks: 정답 런북 id. Recall@k / MRR 계산에 쓴다.
#              실제 id: cpu-spike, db-down, disk-full, high-latency, memory-leak, network-timeout
# must_include: 정답 런북 본문에 실제로 있는 핵심 어구 (없으면 빈 리스트).
# design_note: normal 문항만. aligned = 증상과 일치하는 알람을 가진 시스템을 지목한 문항,
#              paraphrased = 운영자가 자기 말로 증상을 풀어 쓴 문항.
# category: normal | constrained | composite | unregistered | ambiguous

queries:
  # ---------- normal (12) : 런북 6종 x 2건 ----------
  - id: Q01
    category: normal
    query: "DB 프라이머리가 다운됐습니다. 대응 절차를 알려주세요."
    gold_runbooks: [db-down]
    must_include: ["커넥션 풀", "failover"]
    design_note: "aligned"
    human_label: null

  - id: Q02
    category: normal
    query: "auth-service DB 커넥션이 다 끊겼고 DB 프라이머리가 응답이 없습니다. 어떻게 복구하죠?"
    gold_runbooks: [db-down]
    must_include: ["failover", "리플리케이션"]
    design_note: "paraphrased"
    human_label: null

  - id: Q03
    category: normal
    query: "auth-service 응답이 느립니다. p95 지연이 2초를 넘는데 어떻게 대응해야 하나요?"
    gold_runbooks: [high-latency]
    must_include: ["커넥션 풀", "타임아웃"]
    design_note: "aligned"
    human_label: null

  - id: Q04
    category: normal
    query: "로그인할 때 화면이 한참 걸린다는 문의가 계속 들어옵니다. 지연 원인 확인 순서를 알려주세요."
    gold_runbooks: [high-latency]
    must_include: ["로드밸런서", "읽기 복제본"]
    design_note: "paraphrased"
    human_label: null

  - id: Q05
    category: normal
    query: "log-service의 /var/log 디스크 사용률이 95%입니다. 지금 뭘 해야 하나요?"
    gold_runbooks: [disk-full]
    must_include: ["임시 파일", "로테이션"]
    design_note: "aligned"
    human_label: null

  - id: Q06
    category: normal
    query: "서버 저장공간이 거의 꽉 찼다고 알람이 왔어요. 로그가 계속 쌓이는 것 같은데 급한 조치가 뭔가요?"
    gold_runbooks: [disk-full]
    must_include: ["로그 레벨", "볼륨"]
    design_note: "paraphrased"
    human_label: null

  - id: Q07
    category: normal
    query: "payments-service CPU가 91%입니다. 어떻게 대응하나요?"
    gold_runbooks: [cpu-spike]
    must_include: ["오토스케일링", "롤백"]
    design_note: "aligned"
    human_label: null

  - id: Q08
    category: normal
    query: "결제 서버 인스턴스 하나가 계속 버벅이고 CPU가 한계 근처에 붙어 있어요. 배포 직후부터 그런 것 같은데 어떻게 하죠?"
    gold_runbooks: [cpu-spike]
    must_include: ["롤백", "배치 작업 중복"]
    design_note: "paraphrased"
    human_label: null

  - id: Q09
    category: normal
    query: "cache-service 메모리가 6시간째 계속 올라가고 힙이 한계에 가깝습니다. 대응 절차를 알려주세요."
    gold_runbooks: [memory-leak]
    must_include: ["재시작", "힙 덤프"]
    design_note: "aligned"
    human_label: null

  - id: Q10
    category: normal
    query: "캐시 서버가 몇 시간째 메모리를 계속 먹고 있어서 곧 OOM 날 것 같아요. 일단 뭘 해야 하나요?"
    gold_runbooks: [memory-leak]
    must_include: ["재시작", "롤백"]
    design_note: "paraphrased"
    human_label: null

  - id: Q11
    category: normal
    query: "gateway-service에서 payments-service로 가는 호출이 504 타임아웃이고 패킷 손실도 있습니다. 확인 순서를 알려주세요."
    gold_runbooks: [network-timeout]
    must_include: ["DNS", "헬스체크"]
    design_note: "aligned"
    human_label: null

  - id: Q12
    category: normal
    query: "서비스 간 호출이 간헐적으로 타임아웃 나는데 방화벽이나 DNS 쪽 변경이 있었는지 모르겠어요. 어디부터 봐야 하나요?"
    gold_runbooks: [network-timeout]
    must_include: ["보안그룹", "우회"]
    design_note: "paraphrased"
    human_label: null

  # ---------- constrained (3) : 정상 장애 + 형식/길이 제약 ----------
  - id: Q13
    category: constrained
    query: "DB 다운 시 대응 절차를 알려주세요. 답변은 50자 이내로 간결하게 작성해주세요."
    gold_runbooks: [db-down]
    must_include: []
    note: "길이 제약 준수 여부가 clarity 판정 대상. 강의 1:49:32 예시와 동일 패턴."
    human_label: null

  - id: Q14
    category: constrained
    query: "payments-service CPU 급증 대응 절차를 표로 정리해주세요. 열은 단계, 조치 두 개로 해주세요."
    gold_runbooks: [cpu-spike]
    must_include: ["롤백"]
    note: "표 형식 제약 준수 여부가 clarity 판정 대상."
    human_label: null

  - id: Q15
    category: constrained
    query: "log-service 디스크 부족 대응을 3줄 이내로 요약해주세요."
    gold_runbooks: [disk-full]
    must_include: []
    note: "줄 수 제약 준수 여부가 clarity 판정 대상."
    human_label: null

  # ---------- composite (3) : 동시 증상, 런북 2건 ----------
  - id: Q16
    category: composite
    query: "gateway-service에서 payments-service로 504 타임아웃이 나는데 동시에 payments-service CPU도 91%입니다. 같이 어떻게 대응하죠?"
    gold_runbooks: [network-timeout, cpu-spike]
    must_include: []
    note: "복합 장애. 런북 2건을 모두 끌어와야 Recall@k = 1.0. 베이스는 런북 1건만 검색하므로 구조적 한계가 드러나는 문항."
    human_label: null

  - id: Q17
    category: composite
    query: "cache-service 메모리가 계속 오르는 중인데 auth-service 응답 지연(p95 2.4초)도 같이 발생하고 있습니다. 둘 다 대응 절차를 알려주세요."
    gold_runbooks: [memory-leak, high-latency]
    must_include: []
    note: "복합 장애. 런북 2건을 모두 끌어와야 Recall@k = 1.0."
    human_label: null

  - id: Q18
    category: composite
    query: "log-service 디스크가 95%까지 찼고 auth-service 커넥션 풀도 92%라 응답이 느려졌습니다. 둘 다 어떻게 처리하죠?"
    gold_runbooks: [disk-full, high-latency]
    must_include: []
    note: "복합 장애. 런북 2건을 모두 끌어와야 Recall@k = 1.0."
    human_label: null

  # ---------- unregistered (3) : 등록되지 않은 시스템/장애 유형 ----------
  - id: Q19
    category: unregistered
    query: "외부 PG사 결제 승인 API가 계속 실패합니다. 복구 절차 알려주세요."
    gold_runbooks: []
    must_include: []
    expect_behavior: "등록된 런북·모니터링에 없음을 밝히고 근거 없는 원인·수치를 만들지 않는다"
    note: "근거 없는 원인 확정을 하면 completeness Fail이어야 한다. 등록 시스템인 gateway-service/payments-service와 혼동하지 않는지도 본다."
    human_label: null

  - id: Q20
    category: unregistered
    query: "Kafka 컨슈머 랙이 계속 쌓이고 있습니다. 대응 절차 알려주세요."
    gold_runbooks: []
    must_include: []
    expect_behavior: "등록된 런북·모니터링에 없음을 밝히고 근거 없는 원인·수치를 만들지 않는다"
    human_label: null

  - id: Q21
    category: unregistered
    query: "SSL 인증서가 만료돼서 사이트 접속이 막혔습니다. 어떻게 해야 하나요?"
    gold_runbooks: []
    must_include: []
    expect_behavior: "등록된 런북·모니터링에 없음을 밝히고 근거 없는 원인·수치를 만들지 않는다"
    human_label: null

  # ---------- ambiguous (3) : 모호한 요청 ----------
  - id: Q22
    category: ambiguous
    query: "서버가 이상해요."
    gold_runbooks: []
    must_include: []
    expect_behavior: "대상 시스템·증상을 되묻거나, 확인한 범위를 명시한다"
    human_label: null

  - id: Q23
    category: ambiguous
    query: "아침부터 알람이 계속 울리는데 뭐가 문제인지 모르겠어요. 봐주실 수 있나요?"
    gold_runbooks: []
    must_include: []
    expect_behavior: "대상 시스템·증상을 되묻거나, 확인한 범위를 명시한다"
    human_label: null

  - id: Q24
    category: ambiguous
    query: "어제부터 뭔가 자꾸 장애 같은 게 나는데 어떻게 해야 해요?"
    gold_runbooks: []
    must_include: []
    expect_behavior: "대상 시스템·증상을 되묻거나, 확인한 범위를 명시한다"
    human_label: null
